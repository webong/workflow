name: WorkFlow CI

on:
  push:
    paths:
      - '**'
  pull_request:
    paths:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workflow_test
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U workflow -d workflow_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis
          coverage: none
      - name: Configure production-driver tests
        run: |
          echo "WORK_FLOW_POSTGRES_DSN=pgsql:host=127.0.0.1;port=5432;dbname=workflow_test" >> "$GITHUB_ENV"
          echo "WORK_FLOW_POSTGRES_USER=workflow" >> "$GITHUB_ENV"
          echo "WORK_FLOW_POSTGRES_PASSWORD=workflow" >> "$GITHUB_ENV"
          echo "WORK_FLOW_REDIS_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "WORK_FLOW_REDIS_PORT=6379" >> "$GITHUB_ENV"
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer analyse
      - run: composer test
      - run: composer types
      - run: git diff --exit-code -- types/work-flow.generated.ts
