name: Publish tested release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable core version tag
        required: true
        type: string
      run_id:
        description: Successful WorkFlow CI run on that exact tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-tested-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Verify successful tagged CI provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CI_RUN: ${{ inputs.run_id }}
        run: |
          python3 tools/prepare-release.py --validate-tag "$RELEASE_TAG"
          [[ "$CI_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" > /tmp/release-ci.json
          jq -e --arg sha "$(git rev-parse HEAD)" --arg tag "$RELEASE_TAG" --arg repo "$GITHUB_REPOSITORY" '
            .status == "completed" and .conclusion == "success" and
            .head_sha == $sha and .head_branch == $tag and
            .path == ".github/workflows/ci.yml" and
            .head_repository.full_name == $repo and
            (.event == "push" or .event == "workflow_dispatch")
          ' /tmp/release-ci.json

  native:
    name: Native (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and verify native runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: mod/typephp/Dockerfile
          target: release
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: workflow-native:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.arch }}
      - name: Export SDK bundle
        uses: docker/build-push-action@v7
        with:
          context: .
          file: mod/typephp/Dockerfile
          target: artifacts
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=dist/native
      - name: Verify archive checksum and final image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          (cd dist/native && sha256sum -c "workflow-native-linux-$ARCH.tar.gz.sha256")
          printf '%s' '{"protocol":1,"operation":"start","run_id":"ci","definition":{"key":"empty"}}' |
            docker run --rm -i "workflow-native:ci-$ARCH" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["state"]["status"] == "completed"'
      - name: Save tested runtime image for release
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "workflow-native:ci-$ARCH" | gzip > "dist/native/workflow-native-image-linux-$ARCH.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-native-${{ matrix.arch }}
          path: dist/native/*.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  rpc:
    name: RPC (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      WORKFLOW_RPC_IMAGE: workflow-rpc:ci-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - name: Build RPC image and run Go checks
        uses: docker/build-push-action@v7
        with:
          context: .
          file: examples/standalone/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.WORKFLOW_RPC_IMAGE }}
          cache-from: type=gha,scope=rpc-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rpc-${{ matrix.arch }}
      - name: Test HTTP lifecycle against PostgreSQL
        run: |
          docker compose version
          docker compose -f examples/standalone/compose.ci.yml up -d --wait --wait-timeout 90 workflowd queue-worker
          docker compose -f examples/standalone/compose.ci.yml run --rm smoke
      - name: Container diagnostics
        if: failure()
        run: docker compose -f examples/standalone/compose.ci.yml logs --no-color
      - name: Stop isolated smoke stack
        if: always()
        run: docker compose -f examples/standalone/compose.ci.yml down --volumes
      - name: Save tested RPC image for release
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/rpc
          docker save "$WORKFLOW_RPC_IMAGE" | gzip > "dist/rpc/workflow-rpc-image-linux-$ARCH.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-rpc-${{ matrix.arch }}
          path: dist/rpc/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [verify, native, rpc]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: distribution-*
          merge-multiple: true
          path: dist/release
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested images and SDK bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: bash tools/publish-release.sh
